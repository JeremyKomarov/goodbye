# The project's gate, on every push. Written to .github/workflows/verify.yml by the scaffolder;
# from then on it is yours — add jobs, a deploy, a matrix.
#
# `npm run verify` is what every change is held to before a PR (.agents/docs/05-WORKFLOW.md §3),
# and the pre-commit hook runs the plan check per commit — but both are local, and
# `git commit --no-verify` skips the hook by design. This is the copy nobody can skip
# (.agents/docs/DECISIONS.md #24, #28).
#
# `npm ci` needs package-lock.json committed. A project scaffolded with --skip-install has none
# until its first `npm install`.
name: verify

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run verify

  # The end-to-end run (playwright.config.ts), against the dev server. CI holds no secret key, so
  # nothing is written: the room's run and the database read skip (`E2E_NO_DATABASE`), and the
  # key is a placeholder only so the server boots. The public URL and key are the site's own,
  # the ones every visitor's browser gets, kept as repository variables.
  e2e:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      SUPABASE_SECRET_KEY: ci-has-no-secret-key
      E2E_NO_DATABASE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
